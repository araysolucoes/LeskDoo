<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeskDoo | Aray Soluções</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#eaf3ff;background:#071221}body{margin:0}header{background:#061d40;padding:24px 5%;border-bottom:2px solid #0869ef}h1{margin:0}small,p{color:#aabbd0}main{max-width:1200px;margin:26px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:16px}.card{background:#10233d;border:1px solid #254162;border-radius:15px;padding:19px;margin-bottom:18px}h2{margin:0 0 14px;font-size:18px}button{background:#0869ef;border:0;border-radius:8px;color:white;padding:9px 12px;cursor:pointer;margin:4px}button:disabled{opacity:.35;cursor:not-allowed}.value{font-size:24px;font-weight:700;color:#ffc340}table{border-collapse:collapse;width:100%}th,td{padding:12px;text-align:left;border-bottom:1px solid #29415c}th{color:#b1c8e7}code{overflow-wrap:anywhere}
</style></head><body><header><h1>LeskDoo</h1><small>Aray Soluções · Gerenciamento de infraestrutura e IA local</small></header><main><div id="message">Carregando inventário...</div><div id="metrics" class="grid"></div><section class="card"><h2>Recomendação de VM</h2><div id="plan"></div></section><section class="card"><h2>Máquinas virtuais</h2><div id="vms"></div></section><section class="card"><h2>Rede e armazenamento</h2><div id="other"></div></section></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refresh(){try{const r=await fetch('/api/status');if(!r.ok)throw Error(r.status);const d=await r.json();document.getElementById('message').textContent=d.warnings.join(' | ');const h=d.host;const metrics=[['RAM total',h.ram_total_gb+' GiB'],['RAM disponível',h.ram_available_gb+' GiB'],['CPU',h.cpu_physical+' núcleos / '+h.cpu_logical+' threads'],['VirtualBox',h.virtualbox_installed?'Detectado':'Ausente'],['GPUs',h.gpus.map(g=>g.Name).join(', ')||'Não identificada'],['Discos',h.disks.length+' volumes']];document.getElementById('metrics').innerHTML=metrics.map(a=>`<div class="card"><h2>${esc(a[0])}</h2><div class="value">${esc(a[1])}</div></div>`).join('');const p=d.recommendation;document.getElementById('plan').innerHTML=`<p>${p.eligible?'Perfil inicial elegível':'Não recomendado provisionar automaticamente'}</p><p>${esc(p.ram_gb)} GiB RAM · ${esc(p.vcpus)} vCPU · ${esc(p.disk_gb)} GiB disco · ${esc(p.volume||'Sem volume elegível')}</p><p>IA: ${esc(p.model_tier)}</p>${p.notes.map(n=>'<p>'+esc(n)+'</p>').join('')}`;document.getElementById('vms').innerHTML=d.vms.length?`<table><tr><th>VM</th><th>UUID</th><th>Estado</th><th>Controle</th></tr>${d.vms.map(v=>`<tr><td>${esc(v.name)}</td><td><code>${esc(v.uuid)}</code></td><td>${esc(v.state)}</td><td><button onclick="power('${v.uuid}','start')" ${v.state==='running'?'disabled':''}>Ligar</button><button onclick="power('${v.uuid}','acpi_shutdown')" ${v.state!=='running'?'disabled':''}>Desligar ACPI</button></td></tr>`).join('')}</table>`:'Nenhuma VM encontrada.';document.getElementById('other').innerHTML=`<p>Bridges: ${esc(d.bridged_interfaces.join(', ')||'Nenhuma')}</p>${h.disks.map(x=>`<p>${esc(x.device)} (${esc(x.mount)}): ${esc(x.free_gb)} GiB livres / ${esc(x.total_gb)} GiB</p>`).join('')}`;}catch(e){document.getElementById('message').textContent='Falha ao ler inventário: '+e.message;}}
async function power(uuid,action){if(!confirm('Confirma '+action+' para '+uuid+'?'))return;const r=await fetch('/api/vms/'+uuid+'/power',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});const d=await r.json();alert(d.error|| (r.ok?'Comando enviado':'Erro '+r.status));refresh()}
refresh();setInterval(refresh,15000);
</script></body></html>
