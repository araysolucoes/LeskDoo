services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_DB: leskdoo
      POSTGRES_USER: leskdoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["leskdoo-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leskdoo"]
      interval: 10s
      retries: 5
volumes:
  leskdoo-db:
