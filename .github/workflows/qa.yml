name: QA
on:
  push:
    branches: [dev, hml, main]
  pull_request:
    branches: [dev, hml, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q leskdoo tests run.py
      - name: Critical lint
        run: python -m ruff check --select E4,E7,E9,F63,F7,F82 leskdoo tests run.py
      - name: Pytest
        run: python -m pytest -q --junitxml=pytest-results.xml --cov=leskdoo --cov-report=xml --cov-report=term-missing
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            pytest-results.xml
            coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  config:
    name: YAML and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Validate YAML syntax
        run: python scripts/check_yaml.py
      - name: Validate Compose schemas
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-secret
          WEBUI_SECRET_KEY: ci-placeholder-not-a-secret
          ZABBIX_DB_PASSWORD: ci-placeholder-not-a-secret
        run: |
          docker compose -f deploy/compose.postgres.yml config --quiet
          docker compose -f deploy/compose.ai.yml config --quiet
      - name: Docker file conventions
        run: git diff --check
